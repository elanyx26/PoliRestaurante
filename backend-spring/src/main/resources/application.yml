spring:
  application:
    name: restaurante-api
  config:
    # Carga los secretos desde .env (opcional). Las variables de entorno del sistema tienen prioridad.
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # Pool pequeño: la base gratuita (Neon) y los servidores de poca memoria no necesitan más.
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 0
      connection-timeout: 30000
      # Neon apaga el cómputo tras 5 min sin uso y corta las conexiones: se renuevan antes de que eso ocurra.
      max-lifetime: 240000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  jackson:
    default-property-inclusion: non_null

server:
  # En plataformas como Render el puerto lo da la variable PORT.
  port: ${PORT:${SERVER_PORT:8080}}
  error:
    include-message: never
    include-stacktrace: never

app:
  timezone: ${APP_TIMEZONE:America/Bogota}
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  initial-admin:
    name: ${INITIAL_ADMIN_NAME:Administrador}
    email: ${INITIAL_ADMIN_EMAIL:}
    password: ${INITIAL_ADMIN_PASSWORD:}
  login:
    max-attempts: 5
    lock-minutes: 15
  storage:
    # local = carpeta del servidor | db = tabla "imagenes" en PostgreSQL | r2 = Cloudflare R2 (S3)
    provider: ${STORAGE_PROVIDER:local}
    uploads-dir: ${UPLOADS_DIR:./uploads}
    r2:
      endpoint: ${R2_ENDPOINT:}
      bucket: ${R2_BUCKET:}
      access-key-id: ${R2_ACCESS_KEY_ID:}
      secret-access-key: ${R2_SECRET_ACCESS_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  # En producción conviene apagarlo: SWAGGER_ENABLED=false
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
